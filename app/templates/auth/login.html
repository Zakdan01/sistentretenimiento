{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Ingresar</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login', next=next or '') }}">
    <label>Email
      <input type="email" name="email" value="{{ form.email if form else '' }}" required>
    </label>
    <label>Contraseña
      <input type="password" name="password" required>
    </label>
    <button type="submit">Ingresar</button>
  </form>
  <p class="muted">¿No tenés cuenta? <a href="/auth/register">Creá una</a>.</p>
</section>
{% endblock %}
