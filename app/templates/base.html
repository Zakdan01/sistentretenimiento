<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteca{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Biblioteca</a>
    <nav>
      <a href="/search">Buscar</a>
      {% if current_user %}
        <a href="/import">Importar</a>
        <a href="/library">Mi biblioteca</a>
        <a href="/profile">{{ current_user.display_name }}</a>
        <form method="post" action="/auth/logout" class="inline">
          <button type="submit" class="link">Salir</button>
        </form>
      {% else %}
        <a href="/auth/login">Ingresar</a>
        <a href="/auth/register">Crear cuenta</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
